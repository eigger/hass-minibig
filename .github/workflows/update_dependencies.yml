# Shared standards; upstream action SHAs verified 2026-10-17.
name: Update dependencies
'on':
  schedule:
  - cron: 41 4 * * 1
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  dependencies:
    permissions:
      contents: write
      pull-requests: write
    uses: eigger/hass-repo-standards/.github/workflows/dependency-update.yml@0c1592977591ecba077a4666d699840062711201 # reviewed standards commit
    with:
      standards-ref: 0c1592977591ecba077a4666d699840062711201
      domain: minibig
      packages: '["blesession"]'
      python-version: '3.14'
      ha-components: bluetooth sensor binary_sensor button switch cover select number
      test-profile: ha
      validation-command: python -m ruff check . && python -m pytest tests/components/minibig/ -v
